name: Build

on:
  workflow_dispatch:
    inputs:
      signaling_url:
        description: 'Public signaling URL (wss://...) baked into the build. Defaults to the SIGNALING_URL repository variable.'
        required: false
        type: string
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Optional public signaling URL, e.g. wss://sight-your-app.onrender.com/ws
  # Set it as a repository variable (Settings → Secrets and variables → Actions → Variables).
  VITE_SIGNALING_URL: ${{ inputs.signaling_url || vars.SIGNALING_URL }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: AppImage
            suffix: linux
          - os: windows-latest
            target: nsis
            suffix: win
          - os: macos-latest
            target: dmg
            suffix: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build app bundles
        run: npm run build

      - name: Package (${{ matrix.suffix }})
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          # Optional signing: set these secrets only if you have certificates.
          # macOS: CSC_LINK (p12) + CSC_KEY_PASSWORD ; Windows: CSC_LINK + CSC_KEY_PASSWORD (or a codesigning cert).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sight-${{ matrix.suffix }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/latest*.yml
            release/*.yml
          if-no-files-found: ignore
          retention-days: 14