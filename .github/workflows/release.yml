name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  signaling-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build signaling image
        run: docker build -f Dockerfile.signaling -t sight-signaling:${{ github.ref_name }} .

  desktop:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SIGNALING_URL: ${{ secrets.VITE_SIGNALING_URL }}
          VITE_STUN_URL: ${{ secrets.VITE_STUN_URL }}
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_PASSWORD: ${{ secrets.VITE_TURN_PASSWORD }}
      - name: Package (dir, no signing — smoke only on CI)
        run: npm run package:dir
      - name: Publish (signed, on tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing/notarization (set as repo secrets):
          # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID,
          # CSC_LINK (base64 .p12), CSC_KEY_PASSWORD
          # Windows signing:
          # CSC_LINK, CSC_KEY_PASSWORD
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
